<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Stackly Robotics</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="error.css">
</head>
<body>

    <main class="error-page">
        <div class="error-grid"></div>

        <div class="error-glow error-glow-one"></div>
        <div class="error-glow error-glow-two"></div>

        <div class="error-content">
            <div class="error-icon" id="errorIcon">
                <i class="fa-solid fa-robot"></i>
            </div>

            <div class="error-number" id="errorNumber">404</div>

            <span class="error-label">PAGE NOT FOUND</span>

            <h1 id="errorTitle">Oops! This page has moved.</h1>

            <p id="errorText">
                The page you are looking for may have been removed, renamed,
                or is temporarily unavailable.
            </p>

            <div class="error-actions" id="errorActions">
                <button type="button" class="error-btn error-btn-back" id="backButton">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Go Back</span>
                </button>

                <a href="index.html" class="error-btn error-btn-home">
                    <i class="fa-solid fa-house"></i>
                    <span>Back to Home</span>
                </a>
            </div>

            <div class="error-status">
                <span class="status-dot"></span>
                <span>System route unavailable</span>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="error.js"></script>

</body>
</html>
